input {
  http {
    host => "10.10.1.61"
    port => 5044
    ecs_compatibility => "disabled"
    ssl_enabled => true
    ssl_certificate => "/etc/logstash/tls/server.crt"
    ssl_key => "/etc/logstash/tls/server.key"
    ssl_certificate_authorities => ["/etc/logstash/tls/ingest-ca.crt"]
    ssl_client_authentication => "required"
    ssl_supported_protocols => ["TLSv1.2", "TLSv1.3"]
    max_content_length => 8192
    max_pending_requests => 8
    threads => 1
    response_code => 204
  }
}
filter {
  ruby {
    path => "/etc/logstash/projection_filter.rb"
  }
}
output {
  elasticsearch {
    hosts => ["https://127.0.0.1:9200"]
    user => "veyport_ingest"
    password => "${VEYPORT_INGEST_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/etc/logstash/tls/ca.crt"]
    ssl_verification_mode => "full"
    index => "%{[@metadata][destination_index]}"
    document_id => "%{event_id}"
    action => "index"
    manage_template => false
    ilm_enabled => false
    ecs_compatibility => "disabled"
  }
}
