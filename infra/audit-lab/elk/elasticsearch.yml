cluster.name: veyport-audit-lab
node.name: elk-lab
discovery.type: single-node
network.host: 127.0.0.1
http.port: 9200
path.data: /srv/veyport/data/elasticsearch
path.logs: /srv/veyport/logs/elasticsearch
xpack.security.enabled: true
xpack.security.autoconfiguration.enabled: false
xpack.license.self_generated.type: basic
xpack.security.http.ssl.enabled: true
xpack.security.http.ssl.key: tls/server.key
xpack.security.http.ssl.certificate: tls/server.crt
xpack.security.http.ssl.certificate_authorities: [tls/ca.crt]
xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.verification_mode: certificate
xpack.security.transport.ssl.key: tls/server.key
xpack.security.transport.ssl.certificate: tls/server.crt
xpack.security.transport.ssl.certificate_authorities: [tls/ca.crt]
