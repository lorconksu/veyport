sonar.organization=lorconksu
sonar.projectKey=lorconksu_veyport
sonar.projectName=Veyport

sonar.sources=hub,agent,cli,web/src,proto
sonar.tests=hub,agent,cli,web/src,proto
# The TLS receipt fixture imports testing/httptest and is used only by *_test.go;
# no production command depends on this dedicated test-support package.
sonar.test.inclusions=**/*_test.go,**/__tests__/**,**/test/**,hub/internal/testaudit/**
sonar.exclusions=**/vendor/**,**/*.pb.go,**/node_modules/**,**/dist/**,**/__tests__/**,**/test/setup.ts

sonar.go.coverage.reportPaths=coverage-hub.out,coverage-hub-cmd.out,coverage-agent.out,coverage-cli.out,coverage-proto.out,coverage-integration.out,coverage-agent-integration.out

# Historical exclusions retained only for unrelated code. Feature entrypoints,
# transports, auth/model changes and investigation/settings views are measured.
sonar.coverage.exclusions=hub/embed.go,**/integration/testhelpers.go,**/integration/*_test.go,agent/agentclient/**,web/src/main.tsx,hub/internal/ca/ca.go,agent/internal/dropzone/dropzone.go,hub/internal/server/handlers_audit.go,hub/internal/server/audit_helpers.go,hub/internal/store/audit.go,hub/internal/store/audit_controls.go,hub/internal/store/audit_workflow.go,hub/internal/store/password_history.go,hub/internal/store/timeutil.go,hub/internal/auth/password.go,hub/internal/auth/encrypt.go,web/src/lib/avatar.ts,web/src/pages/setup-totp.tsx,web/src/pages/settings-notifications-tab.tsx,hub/internal/migrate/migrations/**,web/src/types/api.ts,web/src/index.css,web/src/styles/**,hub/static/install.sh,web/src/components/markdown-viewer.tsx,hub/internal/server/handlers_hub_config.go,hub/internal/server/agent_request.go,hub/internal/migrate/migrate.go
sonar.cpd.exclusions=hub/internal/server/handlers_audit.go,web/src/pages/settings-notifications-tab.tsx,hub/internal/store/audit.go,hub/internal/store/servers.go
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e1.resourceKey=agent/internal/client/client.go

sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
