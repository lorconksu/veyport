syntax = "proto3";
package veyport.v1;
option go_package = "github.com/wyiu/veyport/proto/veyport/v1";

service AgentService {
  // Bidirectional stream — agent connects, Hub sends commands, agent responds
  rpc Connect(stream AgentMessage) returns (stream HubMessage);
  // Dedicated enrolled-node mTLS connection; never the enrollment control path.
  rpc Execute(stream ExecutionAgentMessage) returns (stream ExecutionHubMessage);
  // Maintenance artifacts are selected by the Hub, never by a client URL.
  rpc DownloadUpdate(UpdateArtifactRequest) returns (stream UpdateArtifactChunk);
  rpc AuthorizeUpdate(UpdateArtifactRequest) returns (UpdateAuthorization);
  rpc BootstrapUpdate(UpdateBootstrapRequest) returns (AgentUpdateRequest);
}

// Messages from Agent → Hub
message AgentMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    RegisterAgent register = 2;
    // Stubs for sub-projects 4-6
    FileListResponse file_list_response = 10;
    LogStreamChunk log_stream_chunk = 11;
    FileUploadAck file_upload_ack = 12;
    FileReadResponse file_read_response = 13;
    FileDeleteResponse file_delete_response = 15;
    UnregisterAck unregister_ack = 16;
    CertRenewRequest cert_renew_request = 17;
    TerminalOpenAck terminal_open_ack = 18;
    TerminalData terminal_data = 19;
    TerminalExit terminal_exit = 20;
    ReEnrollRequest reenroll_request = 21;
    ReEnrollProof reenroll_proof = 22;
    ExecutionCapabilities execution_capabilities = 30;
    ExecutionPrepared execution_prepared = 31;
    ExecutionStatus execution_status = 32;
    UpdateCapabilities update_capabilities = 40;
    AgentUpdateStatus update_status = 41;
  }
}

// Messages from Hub → Agent
message HubMessage {
  oneof payload {
    HeartbeatAck heartbeat_ack = 1;
    RegisterAck register_ack = 2;
    // Stubs for sub-projects 4-6
    FileListRequest file_list_request = 10;
    LogStreamRequest log_stream_request = 11;
    FileUploadRequest file_upload_request = 12;
    FileReadRequest file_read_request = 13;
    LogStreamStop log_stream_stop = 14;
    FileDeleteRequest file_delete_request = 15;
    UnregisterRequest unregister_request = 16;
    CertRenewResponse cert_renew_response = 17;
    TerminalOpenRequest terminal_open_request = 18;
    TerminalInput terminal_input = 19;
    TerminalResize terminal_resize = 20;
    TerminalClose terminal_close = 21;
    ReEnrollApproved reenroll_approved = 22;
    ReEnrollDenied reenroll_denied = 23;
    ExecutionPrepare execution_prepare = 30;
    ExecutionAttachRequest execution_attach = 31;
    ExecutionCancel execution_cancel = 32;
    ExecutionStatusRequest execution_status_request = 33;
    AgentUpdateRequest agent_update_request = 40;
    UpdateConfirmation update_confirmation = 41;
  }
}

message Heartbeat {
  string server_id = 1;
  int64 timestamp = 2;
  SystemInfo system_info = 3;
  string ip_address = 4;
}

message HeartbeatAck {
  int64 timestamp = 1;
}

message RegisterAgent {
  string token = 1;
  string hostname = 2;
  string ip_address = 3;
  string os = 4;
  string agent_version = 5;
  bytes csr = 6;
  bytes node_pubkey = 7;
  string enroll_fingerprint = 8;
  bytes node_transport_pubkey = 9;
  ExecutionCapabilities execution_capabilities = 10;
}

message RegisterAck {
  bool success = 1;
  string server_id = 2;
  string error = 3;
  bytes client_cert = 4;
  bytes ca_cert = 5;
  bytes node_kek = 6;
}

message SystemInfo {
  double cpu_percent = 1;
  double memory_percent = 2;
  double disk_percent = 3;
  int64 uptime_seconds = 4;
}

// File browsing (sub-project 4)
message FileListRequest {
  string request_id = 1;
  string path = 2;
}

message FileListResponse {
  string request_id = 1;
  repeated FileNode files = 2;
  string error = 3;
}

message FileNode {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  int64 size = 4;
  bool readable = 5;
}

message FileReadRequest {
  string request_id = 1;
  string path = 2;
  int64 offset = 3;
  int64 limit = 4;
}

message FileReadResponse {
  string request_id = 1;
  bytes data = 2;
  int64 total_size = 3;
  string mime_type = 4;
  string error = 5;
}

// Log tailing (sub-project 5)
message LogStreamRequest {
  string request_id = 1;
  string path = 2;
  int64 offset = 3;
  string grep = 4;
}

message LogStreamChunk {
  string request_id = 1;
  bytes data = 2;
  int64 offset = 3;
}

message LogStreamStop {
  string request_id = 1;
}

// File upload / Dropzone (sub-project 6)
message FileUploadRequest {
  string request_id = 1;
  string filename = 2;
  bytes chunk = 3;
  bool done = 4;
}

message FileUploadAck {
  string request_id = 1;
  bool success = 2;
  string error = 3;
}

// File deletion (dropzone)
message FileDeleteRequest {
  string request_id = 1;
  string path = 2;
}

message FileDeleteResponse {
  string request_id = 1;
  bool success = 2;
  string error = 3;
}

// Server unregistration
message UnregisterRequest {
  string request_id = 1;
}

message UnregisterAck {
  string request_id = 1;
  bool success = 2;
  string error = 3;
}

// Certificate renewal (mTLS)
message CertRenewRequest {
  bytes csr = 1;
}

message CertRenewResponse {
  bytes client_cert = 1;
  bytes ca_cert = 2;
  string error = 3;
}

// Interactive terminal
message TerminalOpenRequest {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  string cwd = 4;
  string run_as_user = 5;
}

message TerminalOpenAck {
  string session_id = 1;
  bool success = 2;
  string error = 3;
}

message TerminalInput {
  string session_id = 1;
  bytes data = 2;
}

message TerminalResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message TerminalData {
  string session_id = 1;
  bytes data = 2;
}

message TerminalExit {
  string session_id = 1;
  int32 exit_code = 2;
  string error = 3;
}

message TerminalClose {
  string session_id = 1;
}

// Re-enrollment (human-approved Tier 2)
message ReEnrollRequest {
  string server_id = 1;
  bytes csr = 2;
  string fingerprint = 3;
}

message ReEnrollApproved {
  bytes ephemeral_pub = 1;
  bytes encrypted_kek = 2;
  bytes challenge = 3;
}

message ReEnrollProof {
  bytes signature = 1;
}

message ReEnrollDenied {
  string reason = 1;
}

// v1 bounds: 32KiB command, 64KiB data frame, 2MiB application buffers,
// 8 shared terminal/exec slots per node, 60s preparation, 60min runtime,
// 5s TERM grace, 60s blocked-delivery deadline (quiet commands have no timeout).
message ExecutionCapabilities {
  uint32 protocol_version = 1;
  bool standard_exec = 2;
  bool protected_script = 3;
  string boot_id = 4;
}
message ExecutionLimits {
  uint32 max_frame_bytes = 1;
  uint32 max_buffer_bytes = 2;
  uint32 runtime_seconds = 3;
  uint32 term_grace_seconds = 4;
  uint32 blocked_consumer_seconds = 5;
}
message ExecutionBinding {
  string execution_id = 1;
  string node_id = 2;
  string preparation_id = 3;
  string boot_id = 4;
  int64 expires_unix_milli = 5;
}
message ExecutionIdentity {
  string username = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  repeated uint32 groups = 4;
  bytes groups_sha256 = 5;
  string home = 6;
  string shell = 7;
  string cwd = 8;
  bytes identity_sha256 = 9;
}
message ExecutionPrepare {
  string execution_id = 1;
  string node_id = 2;
  string run_as_user = 3;
  string command = 4;
  string cwd = 5;
  ExecutionLimits limits = 6;
  // Reserved for enhanced admission; unsupported until capability is advertised.
  bool enhanced = 7;
  bytes script_sha256 = 8;
  uint64 script_length = 9;
}
message ExecutionPrepared {
  string execution_id = 1;
  ExecutionBinding binding = 2;
  ExecutionIdentity identity = 3;
  bytes command_sha256 = 4;
  ExecutionLimits limits = 5;
  string error = 6;
}
message ExecutionAttachRequest {
  ExecutionBinding binding = 1;
  bytes ticket = 2;
}
message ExecutionCancel {
  ExecutionBinding binding = 1;
  string reason = 2;
}
message ExecutionStatusRequest {
  string execution_id = 1;
}
message ExecutionStatus {
  string execution_id = 1;
  ExecutionBinding binding = 2;
  string state = 3;
  string reason = 4;
  ExecutionResult result = 5;
}
message ExecutionAgentMessage {
  oneof payload {
    ExecutionAttachRequest attach = 1;
    ExecutionStarted started = 2;
    ExecutionStartFailed start_failed = 3;
    ExecutionData stdout = 4;
    ExecutionData stderr = 5;
    ExecutionOutputEOF output_eof = 6;
    ExecutionResult result = 7;
    ExecutionStatus status = 8;
  }
}
message ExecutionHubMessage {
  oneof payload {
    ExecutionAttached attached = 1;
    ExecutionStart start = 2;
    ExecutionData input = 3;
    ExecutionInputEOF input_eof = 4;
    ExecutionScriptChunk script_chunk = 5;
    ExecutionScriptEOF script_eof = 6;
    ExecutionCancel cancel = 7;
  }
}
message ExecutionAttached { ExecutionBinding binding = 1; }
message ExecutionStart {
  ExecutionBinding binding = 1;
  bytes command_sha256 = 2;
  bytes identity_sha256 = 3;
  ExecutionLimits limits = 4;
  string policy_version = 5;
  bytes admission_receipt = 6;
  // Enhanced-only expiry copied from hub-verified receipt claims. The agent
  // trusts its enrolled mTLS hub and checks this authority immediately before
  // spawn; it does not independently verify the archive signature.
  int64 admission_expires_unix_milli = 7;
}
message ExecutionStarted { ExecutionBinding binding = 1; }
message ExecutionStartFailed {
  ExecutionBinding binding = 1;
  string state = 2;
  string reason = 3;
}
// Sequences begin at 0 independently for each stdin/stdout/stderr stream.
message ExecutionData { uint64 sequence = 1; bytes data = 2; }
message ExecutionInputEOF { uint64 sequence = 1; }
enum ExecutionOutput { EXECUTION_OUTPUT_UNSPECIFIED = 0; EXECUTION_OUTPUT_STDOUT = 1; EXECUTION_OUTPUT_STDERR = 2; }
message ExecutionOutputEOF { ExecutionOutput output = 1; uint64 sequence = 2; }
message ExecutionScriptChunk { uint64 offset = 1; bytes data = 2; }
message ExecutionScriptEOF { uint64 length = 1; bytes sha256 = 2; }
message ExecutionResult {
  ExecutionBinding binding = 1;
  string state = 2;
  int32 exit_code = 3;
  string signal = 4;
  string reason = 5;
  bool stdout_complete = 6;
  bool stderr_complete = 7;
}

// Update v1 supports only the canonical root-owned Linux/systemd installation.
// Capabilities describe the running executable, not its historical registration.
message UpdateCapabilities {
  uint32 protocol_version = 1;
  string os = 2;
  string arch = 3;
  string version = 4;
  string revision = 5;
  string sha256 = 6;
  string boot_id = 7;
  bool supported = 8;
  string reason = 9;
}
message AgentUpdateRequest {
  string operation_id = 1;
  string version = 2;
  string revision = 3;
  string sha256 = 4;
  int64 bytes = 5;
  int64 expires_unix_milli = 6;
}
message AgentUpdateStatus {
  string operation_id = 1;
  string state = 2;
  string reason = 3;
  string version = 4;
  string revision = 5;
  string sha256 = 6;
  string boot_id = 7;
}
message UpdateConfirmation { string operation_id = 1; string state = 2; }
message UpdateArtifactRequest { string operation_id = 1; }
message UpdateArtifactChunk { int64 offset = 1; bytes data = 2; }
message UpdateAuthorization { string operation_id = 1; int64 expires_unix_milli = 2; }
message UpdateBootstrapRequest { string ticket = 1; UpdateCapabilities capabilities = 2; }
