# Informational only; protected-merge.yml independently authorizes exact PR merges.
name: Snyk PR policy

on:
  workflow_run:
    workflows: [CI]
    types: [in_progress]

permissions: {}

jobs:
  admission:
    name: admission
    if: github.event_name == 'workflow_run' && github.event.action == 'in_progress' && github.repository == 'lorconksu/veyport' && github.repository_id == '1188082218' && github.repository_owner_id == '13374789' && github.ref == 'refs/heads/main' && github.event.workflow_run.workflow_id == '251054731' && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.event == 'pull_request' && vars.SNYK_PR_POLICY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    outputs:
      decision: ${{ steps.admit.outputs.decision }}
      source_sha: ${{ steps.admit.outputs.source_sha }}
      admission_json: ${{ steps.admit.outputs.admission_json }}
    env:
      CONTROL: ${{ github.workspace }}/controller
      CONTROL_SHA: ${{ github.sha }}
      SNYK_PR_POLICY_ENABLED: ${{ vars.SNYK_PR_POLICY_ENABLED }}
    steps:
      - name: Checkout trusted main controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lorconksu/veyport
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Validate trusted controller and activation
        id: activation
        shell: bash
        run: |
          set -euo pipefail
          # GitHub string comparisons fold case; enforce exact true before informational writes.
          test "$SNYK_PR_POLICY_ENABLED" = true
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$CONTROL" rev-parse HEAD)" = "$CONTROL_SHA"
          printf 'enabled=true\n' >> "$GITHUB_OUTPUT"

      - name: Admit current PR and create informational check
        id: admit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 -I -B "$CONTROL/scripts/security/snyk_pr_policy.py" admit

  scan:
    name: scan
    needs: admission
    if: needs.admission.result == 'success' && needs.admission.outputs.decision == 'scan'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CONTROL: ${{ github.workspace }}/controller
      SOURCE: ${{ github.workspace }}/source
      SOURCE_SHA: ${{ needs.admission.outputs.source_sha }}
      ADMISSION_JSON: ${{ needs.admission.outputs.admission_json }}
      CONTROL_SHA: ${{ github.sha }}
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      CGO_ENABLED: '0'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      SNYK_CFG_DISABLE_ANALYTICS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Initialize private evidence
        id: initialize
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          candidate_root="$RUNNER_TEMP/snyk-pr-policy"
          mkdir -p "$candidate_root/raw" "$candidate_root/tools" "$candidate_root/home" "$candidate_root/config" "$candidate_root/cache"
          chmod 700 "$candidate_root"
          : > "$candidate_root/config/npm-user.npmrc"
          : > "$candidate_root/config/npm-global.npmrc"
          public_python_root="$(mktemp -d /tmp/veyport-snyk-public.XXXXXXXX)"
          {
            printf 'TRIAL_ROOT=%s\n' "$candidate_root"
            printf 'HOME=%s/home\n' "$candidate_root"
            printf 'XDG_CONFIG_HOME=%s/config\n' "$candidate_root"
            printf 'XDG_CACHE_HOME=%s/cache\n' "$candidate_root"
            printf 'NPM_CONFIG_USERCONFIG=%s/config/npm-user.npmrc\n' "$candidate_root"
            printf 'NPM_CONFIG_GLOBALCONFIG=%s/config/npm-global.npmrc\n' "$candidate_root"
            printf 'NPM_CONFIG_CACHE=%s/cache/npm\n' "$candidate_root"
            printf 'GOCACHE=%s/cache/go-build\n' "$candidate_root"
            printf 'GOMODCACHE=%s/cache/go-mod\n' "$candidate_root"
            printf 'PUBLIC_PYTHON_ROOT=%s\n' "$public_python_root"
          } >> "$GITHUB_ENV"

      - name: Checkout trusted main controller
        id: controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lorconksu/veyport
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Checkout exact admitted source
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lorconksu/veyport
          ref: ${{ needs.admission.outputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Verify source and inventory before tool setup
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C "$CONTROL" rev-parse HEAD)" = "$CONTROL_SHA"
          # Only the controller Python is imported. Source scripts are never run.
          /usr/bin/python3 -I -B -c 'import importlib.util, os; from pathlib import Path; s=importlib.util.spec_from_file_location("policy", Path(os.environ["CONTROL"])/"scripts/security/snyk_policy.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.validate_source(Path(os.environ["SOURCE"]), os.environ["SOURCE_SHA"])' >"$TRIAL_ROOT/raw/preflight.stdout" 2>"$TRIAL_ROOT/raw/preflight.stderr"

      - name: Setup Go
        id: go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.11
          cache: false

      - name: Setup Node
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          package-manager-cache: false

      - name: Bootstrap authenticated packages and checksummed latest stable CLI
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            sudo apt-get update -qq
            sudo apt-get install -y -qq age python3.12-venv
            /usr/bin/python3.12 -I -B "$CONTROL/scripts/diagnostics/snyk_latest_cli.py" --root "$TRIAL_ROOT"
          } >"$TRIAL_ROOT/raw/bootstrap.stdout" 2>"$TRIAL_ROOT/raw/bootstrap.stderr"

      - name: Test trusted helper boundaries before credentials
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            test "$(id -u)" -ne 0
            sudo -n /usr/bin/true
            cd "$CONTROL"
            # Existing cross-UID probes need searchable synthetic test directories.
            (umask 022; /usr/bin/python3.12 -m unittest discover -s scripts/diagnostics -p 'test_*.py')
            (umask 022; /usr/bin/python3.12 -m unittest discover -s scripts/security -p 'test_*.py')
          } >"$TRIAL_ROOT/raw/tests.stdout" 2>"$TRIAL_ROOT/raw/tests.stderr"

      - name: Prepare eight dependency targets without credentials
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 -I -B "$CONTROL/scripts/security/snyk_policy.py" prepare \
            --source "$SOURCE" --control "$CONTROL" --sha "$SOURCE_SHA" --control-sha "$CONTROL_SHA" \
            --root "$TRIAL_ROOT" --scanner "$TRIAL_ROOT/tools/snyk" --public-root "$PUBLIC_PYTHON_ROOT" \
            >"$TRIAL_ROOT/raw/prepare.stdout" 2>"$TRIAL_ROOT/raw/prepare.stderr"

      - name: Scan current source and bound license controls
        id: scan
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 -I -B "$CONTROL/scripts/security/snyk_policy.py" scan \
            --source "$SOURCE" --control "$CONTROL" --sha "$SOURCE_SHA" --control-sha "$CONTROL_SHA" \
            --root "$TRIAL_ROOT" --scanner "$TRIAL_ROOT/tools/snyk" --public-root "$PUBLIC_PYTHON_ROOT" \
            >"$TRIAL_ROOT/raw/scan.stdout" 2>"$TRIAL_ROOT/raw/scan.stderr"

      - name: Evaluate all findings and bound license controls
        id: policy
        if: always() && steps.scan.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 -I -B "$CONTROL/scripts/security/snyk_policy.py" evaluate \
            --source "$SOURCE" --control "$CONTROL" --sha "$SOURCE_SHA" --control-sha "$CONTROL_SHA" \
            --root "$TRIAL_ROOT" --scanner "$TRIAL_ROOT/tools/snyk" --public-root "$PUBLIC_PYTHON_ROOT" \
            >"$TRIAL_ROOT/raw/evaluate.stdout" 2>"$TRIAL_ROOT/raw/evaluate.stderr"

      - name: Seal private evidence and generate allowlisted summary
        id: encrypt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 -I -B "$CONTROL/scripts/security/snyk_policy.py" seal \
            --source "$SOURCE" --control "$CONTROL" --sha "$SOURCE_SHA" --control-sha "$CONTROL_SHA" \
            --root "$TRIAL_ROOT" --scanner "$TRIAL_ROOT/tools/snyk" --public-root "$PUBLIC_PYTHON_ROOT"

      - name: Bind publication envelope
        id: envelope
        if: always() && steps.encrypt.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 -I -B "$CONTROL/scripts/security/snyk_pr_policy.py" envelope

      - name: Upload only encrypted evidence and allowlisted aggregates
        id: upload
        if: always() && steps.encrypt.outcome == 'success' && steps.envelope.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snyk-pr-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/snyk-pr-policy/public/summary.json
            ${{ runner.temp }}/snyk-pr-policy/public/evidence.tar.gz.age
            ${{ runner.temp }}/snyk-pr-policy/public/publication.json
          if-no-files-found: error
          retention-days: 3

      - name: Remove public resolver workspace and private plaintext
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -B "$CONTROL/scripts/security/snyk_policy.py" cleanup \
            --source "$SOURCE" --control "$CONTROL" --sha "$SOURCE_SHA" --control-sha "$CONTROL_SHA" \
            --root "${TRIAL_ROOT:-$RUNNER_TEMP/snyk-pr-policy}" --scanner "${TRIAL_ROOT:-$RUNNER_TEMP/snyk-pr-policy}/tools/snyk" \
            --public-root "${PUBLIC_PYTHON_ROOT:-/tmp/uninitialized-public-python}"

      - name: Final policy and evidence gate
        if: always()
        shell: bash
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          CONTROLLER_OUTCOME: ${{ steps.controller.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          GO_OUTCOME: ${{ steps.go.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          ENVELOPE_OUTCOME: ${{ steps.envelope.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          SEALED_POLICY_EXIT: ${{ steps.encrypt.outputs.sealed_policy_exit }}
        run: |
          set -euo pipefail
          for outcome in "$INITIALIZE_OUTCOME" "$CONTROLLER_OUTCOME" "$SOURCE_OUTCOME" "$PREFLIGHT_OUTCOME" \
            "$GO_OUTCOME" "$NODE_OUTCOME" "$BOOTSTRAP_OUTCOME" "$TESTS_OUTCOME" "$PREPARE_OUTCOME" "$ENVELOPE_OUTCOME"; do
            test "$outcome" = success
          done
          test "$SCAN_OUTCOME" = success
          test "$POLICY_OUTCOME" = success
          test "$ENCRYPT_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
          test "$CLEANUP_OUTCOME" = success
          test "$SEALED_POLICY_EXIT" = 0

  publish:
    name: publish
    needs: [admission, scan]
    if: always() && needs.admission.result == 'success' && needs.admission.outputs.decision == 'scan' && needs.admission.outputs.admission_json != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    env:
      CONTROL: ${{ github.workspace }}/controller
      CONTROL_SHA: ${{ github.sha }}
      SNYK_PR_POLICY_ENABLED: ${{ vars.SNYK_PR_POLICY_ENABLED }}
      ADMISSION_JSON: ${{ needs.admission.outputs.admission_json }}
      SCAN_RESULT: ${{ needs.scan.result }}
    steps:
      - name: Checkout trusted main controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lorconksu/veyport
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Validate trusted controller and activation
        id: activation
        shell: bash
        run: |
          set -euo pipefail
          # GitHub string comparisons fold case; enforce exact true before informational writes.
          test "$SNYK_PR_POLICY_ENABLED" = true
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$CONTROL" rev-parse HEAD)" = "$CONTROL_SHA"
          printf 'enabled=true\n' >> "$GITHUB_OUTPUT"

      - name: Publish informational PR scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 -I -B "$CONTROL/scripts/security/snyk_pr_policy.py" publish
