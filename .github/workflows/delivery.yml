name: Verified Artifact Delivery

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    inputs:
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      prototype:
        type: boolean
        required: true

permissions:
  contents: write

concurrency:
  group: delivery-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-scan:
    name: Release SCA and artifact verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate immutable identity
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          PROTOTYPE: ${{ inputs.prototype }}
        run: |
          args=()
          if [ "$PROTOTYPE" = true ]; then args+=(--prototype); fi
          python3 scripts/release/metadata.py --version "$VERSION" --tag "$TAG" --revision "$GITHUB_SHA" --ref "$GITHUB_REF" "${args[@]}"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install verified scanners
        run: |
          set -euo pipefail
          for tool in grype syft; do bash scripts/release/install_tools.sh "$tool" "$RUNNER_TEMP/release-tools"; done
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          sudo apt-get update
          sudo apt-get install -y clamav skopeo
          sudo systemctl stop clamav-freshclam
          sudo freshclam
      - name: Build and scan exact images and every public binary
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/release/scan_delivery.sh "$RUNNER_TEMP/delivery" "$VERSION" "$GITHUB_SHA"
      - name: Upload verified public artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-delivery
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload scan evidence after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failed-delivery-scan-evidence
          path: ${{ runner.temp }}/delivery/reports/
          retention-days: 14

  publish:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-delivery
          path: ${{ runner.temp }}/delivery/
      - name: Install publication tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Authenticate registry
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_PASSWORD" | skopeo login --username "$REGISTRY_USERNAME" --password-stdin docker.io
      - name: Validate and publish scanned digests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          PROTOTYPE: ${{ inputs.prototype }}
        run: |
          set -euo pipefail
          args=()
          if [ "$PROTOTYPE" = true ]; then args+=(--prototype); fi
          python3 scripts/release/metadata.py --version "$VERSION" --tag "$TAG" --revision "$GITHUB_SHA" --ref "$GITHUB_REF" "${args[@]}"
          bash scripts/release/publish_delivery.sh "$RUNNER_TEMP/delivery" "$TAG" "$VERSION" "$PROTOTYPE" "$GITHUB_SHA"
      - name: Create release with checksummed optional and core binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          PROTOTYPE: ${{ inputs.prototype }}
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/delivery"
          tar -czf "$delivery/release-evidence.tar.gz" -C "$delivery" reports published-images.txt DELIVERY_SHA256SUMS
          python3 - "$delivery" "$GITHUB_SHA" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1])
          (root/'release-notes.md').write_text('Commit: `'+sys.argv[2]+'`\n\nExact scanned image digests:\n\n'+root.joinpath('published-images.txt').read_text()+'\nBinary hashes and scanner findings/classifications are attached. Completion of publication does not imply deployment or Enhanced qualification.\n')
          PY
          args=()
          if [ "$PROTOTYPE" = true ]; then args+=(--prerelease); fi
          assets=()
          while IFS= read -r name; do assets+=("$delivery/bin/$name" "$delivery/bin/$name.sha256"); done < <(python3 -c 'import sys;sys.path.insert(0,"scripts/release");from artifacts import BINARIES;print("\n".join(BINARIES))')
          python3 scripts/release/git_tag.py check "$TAG" "$GITHUB_SHA" "$GITHUB_REPOSITORY"
          gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file "$delivery/release-notes.md" "${args[@]}" "${assets[@]}" "$delivery/bin/SHA256SUMS" "$delivery/bin/artifact-manifest.json" "$delivery/release-evidence.tar.gz"
