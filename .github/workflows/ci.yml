name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      defer_semgrep_to_delivery:
        description: Internal release caller runs the identical required Semgrep gate once in private delivery
        type: boolean
        default: false
      sonar_pull_request_required:
        description: Require an exact open PR context for a prototype scan
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      GITLEAKS_LICENSE:
        required: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            agent/go.sum
            cli/go.sum
            proto/go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: cd web && npm ci

      - name: TypeScript check
        run: cd web && npx tsc --noEmit

      - name: Lint changed frontend code
        run: python3 scripts/release/lint_changed.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Frontend production build
        run: cd web && npm run build

      - name: Frontend tests with coverage
        run: python3 scripts/release/capture_step.py --name frontend -- bash -c 'cd web && npx vitest run --coverage --reporter=json'

      - name: Embed production frontend
        run: mkdir -p hub/web/dist && cp -a web/dist/. hub/web/dist/

      - name: Vet all Go modules
        run: make vet

      - name: Validate workflows
        run: |
          bash scripts/release/install_tools.sh actionlint "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/actionlint"
          sudo apt-get update -qq
          sudo apt-get install -y -qq age python3-venv

      - name: Release helper tests
        run: python3 scripts/release/capture_step.py --name release-helpers -- python3 -m unittest discover -s scripts/release -p "test_*.py"

      - name: Private evidence transport tests
        run: |
          python3 scripts/release/capture_step.py --name evidence-collector -- python3 -m unittest discover -s infra/evidence-collector -p "test_*.py"
          python3 scripts/release/capture_step.py --name candidate-coordinator -- python3 -m unittest discover -s infra/candidate-coordinator -p "test_*.py"

      - name: Security scanner evidence tests
        run: python3 scripts/release/capture_step.py --name security-scanners -- python3 -m unittest discover -s scripts/security -p "test_*.py"

      - name: Native candidate harness tests
        run: python3 scripts/release/capture_step.py --name native-candidate-harness -- python3 -m unittest discover -s scripts/native-candidate -p "test_*.py"

      - name: Backup crypto compatibility with pinned dependencies
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/ssdf-backup-compat-pip-cache
        run: |
          set -euo pipefail
          backup_venv="$RUNNER_TEMP/ssdf-backup-compat-venv"
          python3 -m venv "$backup_venv"
          python3 scripts/release/capture_step.py --name backup-compat-install -- "$backup_venv/bin/python" -m pip install --disable-pip-version-check -r infra/audit-lab/storage/requirements.txt
          python3 scripts/release/capture_step.py --name backup-compat -- "$backup_venv/bin/python" -m unittest discover -s infra/audit-lab/storage -p "test_backup_crypto.py"

      - name: Dependency-Track integration tests
        run: python3 scripts/release/capture_step.py --name dependency-track -- python3 -m unittest discover -s infra/dependency-track -p "test_*.py"

      - name: Application fixture lab guards and streaming compatibility
        run: |
          python3 scripts/release/capture_step.py --name application-access -- python3 -m unittest discover -s infra/application-access -p "test_*.py"
          cd infra/application-access/fixture
          go vet ./...
          python3 ../../../scripts/release/capture_step.py --name application-fixture -- go test -json -race ./...

      - name: Hub tests outside the separately sharded server package
        run: |
          cd hub
          listed="$(go list ./internal/...)"
          mapfile -t packages < <(printf '%s\n' "$listed" | awk '!/\/internal\/(integration|server)$/')
          python3 ../scripts/release/capture_step.py --name hub -- go test -json -race "${packages[@]}" -timeout 30m -coverprofile=../coverage-hub.out -covermode=atomic -coverpkg=./internal/...

      - name: Hub command tests with coverage
        run: cd hub && python3 ../scripts/release/capture_step.py --name hub-command -- go test -json -race ./cmd/... -coverprofile=../coverage-hub-cmd.out -covermode=atomic

      - name: Agent tests with coverage
        run: cd agent && python3 ../scripts/release/capture_step.py --name agent -- go test -json -race ./... -coverprofile=../coverage-agent.out -covermode=atomic

      - name: CLI vet
        run: cd cli && go vet ./...

      - name: CLI tests with coverage
        run: cd cli && python3 ../scripts/release/capture_step.py --name cli -- go test -json -race ./... -coverprofile=../coverage-cli.out -covermode=atomic

      - name: Handwritten shared protocol tests with coverage
        run: cd proto && python3 ../scripts/release/capture_step.py --name proto -- go test -json -race ./... -coverprofile=../coverage-proto.out -covermode=atomic

      - name: Build CLI binary (linux/amd64)
        run: cd cli && go build -o ../bin/vey-linux-amd64 ./cmd/vey

      - name: CLI binary smoke test
        run: ./bin/vey-linux-amd64 --version

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-units
          path: |
            coverage-hub.out
            coverage-hub-cmd.out
            coverage-agent.out
            coverage-cli.out
            coverage-proto.out
            web/coverage/lcov.info

      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: unit
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path "coverage-*.out" --path "web/coverage/*.json" --path "web/coverage/lcov.info"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-unit
          path: ${{ runner.temp }}/ssdf-job-unit/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            proto/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and embed the current production frontend
        run: |
          cd web && npm ci && npm run build
          cd ..
          mkdir -p hub/web/dist && cp -a web/dist/. hub/web/dist/
      - name: Run every test assigned to this server shard
        env:
          SERVER_SHARD_INDEX: ${{ matrix.shard }}
        run: python3 scripts/release/server_test_shards.py run --index "$SERVER_SHARD_INDEX" --shards 6 --timeout 1800 --output coverage-server
      - name: Upload exact server execution and coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-server-shard-${{ matrix.shard }}
          path: coverage-server/shard-${{ matrix.shard }}/
          if-no-files-found: error

  # Keep the required test status dependent on every matrix runner. An omitted,
  # failed or skipped prerequisite must fail this job, rather than skip the gate.
      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: server-${{ matrix.shard }}
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path "coverage-server/shard-${EVIDENCE_JOB#server-}/"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-server-${{ matrix.shard }}
          path: ${{ runner.temp }}/ssdf-job-server-${{ matrix.shard }}/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  test:
    needs: [unit, server-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all complete test jobs
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SERVER_RESULT: ${{ needs.server-tests.result }}
        run: test "$UNIT_RESULT" = success && test "$SERVER_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            proto/go.sum
      - name: Create the compile-only frontend embed required for inventory
        run: mkdir -p hub/web/dist && touch hub/web/dist/index.html
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-units
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-server-shard-*
          path: coverage-server
      - name: Validate the complete server inventory and merge atomic coverage
        run: python3 scripts/release/server_test_shards.py merge --input coverage-server --output coverage-hub.out --include coverage-hub.out --shards 6
      - name: Upload complete coverage for Sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            coverage-hub.out
            coverage-hub-cmd.out
            coverage-agent.out
            coverage-cli.out
            coverage-proto.out
            web/coverage/lcov.info

      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: test
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path "coverage-*.out" --path "web/coverage/lcov.info"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-test
          path: ${{ runner.temp }}/ssdf-job-test/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            agent/go.sum
            cli/go.sum
            proto/go.sum
      - name: Create frontend embed stub
        run: mkdir -p hub/web/dist && touch hub/web/dist/index.html
      - name: Integration tests with coverage
        run: cd hub && python3 ../scripts/release/capture_step.py --name integration -- go test -json -race ./internal/integration/ -v -timeout 10m -coverprofile=../coverage-integration.out -covermode=atomic -coverpkg=./internal/...

      - name: Report agent binary coverage
        if: always()
        run: |
          if [ -f coverage-agent-integration.out ]; then
            echo "=== Agent Binary Integration Coverage ==="
            cd agent && go tool cover -func=../coverage-agent-integration.out | tail -1
          else
            echo "No agent binary coverage file found"
          fi

      - name: Upload integration coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-integration
          path: |
            coverage-integration.out
            coverage-agent-integration.out

      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: integration
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path "coverage-integration.out" --path "coverage-agent-integration.out"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-integration
          path: ${{ runner.temp }}/ssdf-job-integration/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      # Authenticated pulls avoid Docker Hub throttling; skipped gracefully
      # when secrets are unavailable (Dependabot/fork runs).
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run smoke tests
        run: python3 scripts/release/capture_step.py --name smoke -- bash tests/smoke/smoke_test.sh
        env:
          BUILD_ARGS: "--build-arg NODE_IMAGE=node:25-slim --build-arg GO_IMAGE=golang:1.26.10-bookworm"

      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: smoke
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path "tests/smoke/results/" --path "smoke-results/"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-smoke
          path: ${{ runner.temp }}/ssdf-job-smoke/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Install Playwright
        run: cd tests/e2e && npm ci && npx playwright install --with-deps chromium

      # Authenticated pulls avoid Docker Hub throttling; skipped gracefully
      # when secrets are unavailable (Dependabot/fork runs).
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --build-arg NODE_IMAGE=node:25-slim --build-arg GO_IMAGE=golang:1.26.10-bookworm -t veyport-e2e:test .

      - name: Run E2E tests
        run: python3 scripts/release/capture_step.py --name e2e -- bash -c 'cd tests/e2e && E2E_IMAGE=veyport-e2e:test npx playwright test --reporter=json'

      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: e2e
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path "tests/e2e/test-results/" --path "tests/e2e/playwright-report/"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-e2e
          path: ${{ runner.temp }}/ssdf-job-e2e/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  sonarcloud:
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-integration

      - name: Resolve exact Sonar analysis context
        id: sonar-context
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SONAR_PULL_REQUEST_REQUIRED: ${{ inputs.sonar_pull_request_required }}
        run: python3 scripts/release/sonar_context.py

      - uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            ${{ steps.sonar-context.outputs.args }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Capture completed Sonar provider evidence without rescanning
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_CONTEXT_ARGS: ${{ steps.sonar-context.outputs.args }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/release/sonar_job_evidence.py --public-project-results --report-task .scannerwork/report-task.txt --context "$SONAR_CONTEXT_ARGS" --revision "$EXPECTED_SOURCE_SHA" --output sonar-evidence
      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: sonar
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path ".scannerwork/report-task.txt" --path "sonar-evidence/"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-sonar
          path: ${{ runner.temp }}/ssdf-job-sonar/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  sast:
    if: ${{ !inputs.defer_semgrep_to_delivery }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: pip3 install semgrep==1.180.0

      - name: Semgrep SAST gate
        run: |
          set -euo pipefail
          semgrep scan --strict --timeout 30 --config p/golang --config p/typescript --config p/owasp-top-ten --sarif -o semgrep.sarif . > semgrep-output.txt 2>&1
          python3 scripts/release/check_scan.py semgrep semgrep.sarif

      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: sast
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path "semgrep.sarif" --path "semgrep-output.txt"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-sast
          path: ${{ runner.temp }}/ssdf-job-sast/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install verified Gitleaks
        run: |
          bash scripts/release/install_tools.sh gitleaks "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Gitleaks secret scan
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: gitleaks git . --redact --report-format sarif --report-path gitleaks-results.sarif --exit-code 1 > gitleaks-output.txt 2>&1

      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: secrets
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path "gitleaks-results.sarif" --path "gitleaks-output.txt"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-secrets
          path: ${{ runner.temp }}/ssdf-job-secrets/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  vulnerability-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            agent/go.sum
            cli/go.sum
            proto/go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Create frontend embed stub
        run: mkdir -p hub/web/dist && touch hub/web/dist/index.html

      - name: govulncheck production and application fixture source modules
        run: |
          set -euo pipefail
          mkdir -p source-vulnerability-results
          failed=0
          for module in hub agent cli proto infra/application-access/fixture; do
            report="${module//\//-}"
            (cd "$module" && govulncheck -show verbose ./...) > "source-vulnerability-results/$report.txt" 2> "source-vulnerability-results/$report.stderr" || failed=1
          done
          exit "$failed"

      - name: npm audit (Frontend)
        run: |
          set -euo pipefail
          mkdir -p source-vulnerability-results
          cd web
          npm ci --ignore-scripts > ../source-vulnerability-results/npm-install.log 2>&1
          npm audit --json --audit-level=high > ../source-vulnerability-results/npm-audit.json 2> ../source-vulnerability-results/npm-audit.stderr

      - name: Encrypt available private job evidence
        if: always()
        env:
          EVIDENCE_JOB: vulnerability
          JOB_STATUS: ${{ job.status }}
          AGE_RECIPIENT: ${{ vars.SSDF_AGE_RECIPIENT }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          python3 scripts/release/ci_evidence.py --output "$RUNNER_TEMP/ssdf-job-$EVIDENCE_JOB" --recipient "$AGE_RECIPIENT" --job "$EVIDENCE_JOB" --status "$JOB_STATUS" --revision "$EXPECTED_SOURCE_SHA" --workflow "$GITHUB_WORKFLOW_REF" --runner-results "$RUNNER_TEMP/ssdf-results" --path "source-vulnerability-results/"
      - name: Transfer only encrypted job evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-job-v1-${{ github.run_id }}-${{ github.run_attempt }}-vulnerability
          path: ${{ runner.temp }}/ssdf-job-vulnerability/chunk-*.age
          if-no-files-found: error
          retention-days: 7

  auto-release:
    needs: [integration, smoke, e2e, sonarcloud, sast, secret-scan, vulnerability-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: auto-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create next patch release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          if existing_tag="$(git describe --exact-match --tags --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null)"; then
            echo "HEAD is already tagged as ${existing_tag}; skipping auto-release."
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "${latest_tag}" ]; then
            echo "No existing vMAJOR.MINOR.PATCH release tag found." >&2
            exit 1
          fi

          if [[ ! "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest release tag ${latest_tag} is not a vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          next_tag="v${major}.${minor}.$((patch + 1))"

          if git ls-remote --exit-code --tags origin "refs/tags/${next_tag}" >/dev/null 2>&1; then
            echo "Release tag ${next_tag} already exists on origin." >&2
            exit 1
          fi

          git tag -a "${next_tag}" -m "${next_tag}"
          git push origin "refs/tags/${next_tag}"
          gh workflow run release.yml --ref "${next_tag}"

          {
            echo "### Auto Release"
            echo "Created release tag **${next_tag}** from \`${GITHUB_SHA}\`."
            echo "Dispatched the Release workflow for **${next_tag}** to publish Docker artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
