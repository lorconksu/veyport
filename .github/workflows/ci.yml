name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      sonar_pull_request_required:
        description: Require an exact open PR context for a prototype scan
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      GITLEAKS_LICENSE:
        required: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            agent/go.sum
            cli/go.sum
            proto/go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: cd web && npm ci

      - name: TypeScript check
        run: cd web && npx tsc --noEmit

      - name: Lint changed frontend code
        run: python3 scripts/release/lint_changed.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Frontend production build
        run: cd web && npm run build

      - name: Frontend tests with coverage
        run: cd web && npx vitest run --coverage

      - name: Embed production frontend
        run: mkdir -p hub/web/dist && cp -a web/dist/. hub/web/dist/

      - name: Vet all Go modules
        run: make vet

      - name: Validate workflows
        run: |
          bash scripts/release/install_tools.sh actionlint "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/actionlint"
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Release and approval helper tests
        run: python3 -m unittest discover -s scripts/release -p "test_*.py"

      - name: Dependency-Track integration tests
        run: python3 -m unittest discover -s infra/dependency-track -p "test_*.py"

      - name: Application fixture lab guards and streaming compatibility
        run: |
          python3 -m unittest discover -s infra/application-access -p "test_*.py"
          cd infra/application-access/fixture
          go vet ./...
          go test -race ./...

      - name: Hub tests outside the separately sharded server package
        run: |
          cd hub
          listed="$(go list ./internal/...)"
          mapfile -t packages < <(printf '%s\n' "$listed" | awk '!/\/internal\/(integration|server)$/')
          go test -race "${packages[@]}" -timeout 30m -coverprofile=../coverage-hub.out -covermode=atomic -coverpkg=./internal/...

      - name: Hub command tests with coverage
        run: cd hub && go test -race ./cmd/... -coverprofile=../coverage-hub-cmd.out -covermode=atomic

      - name: Agent tests with coverage
        run: cd agent && go test -race ./... -coverprofile=../coverage-agent.out -covermode=atomic

      - name: CLI vet
        run: cd cli && go vet ./...

      - name: CLI tests with coverage
        run: cd cli && go test -race ./... -coverprofile=../coverage-cli.out -covermode=atomic

      - name: Handwritten shared protocol tests with coverage
        run: cd proto && go test -race ./... -coverprofile=../coverage-proto.out -covermode=atomic

      - name: Build CLI binary (linux/amd64)
        run: cd cli && go build -o ../bin/vey-linux-amd64 ./cmd/vey

      - name: CLI binary smoke test
        run: ./bin/vey-linux-amd64 --version

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-units
          path: |
            coverage-hub.out
            coverage-hub-cmd.out
            coverage-agent.out
            coverage-cli.out
            coverage-proto.out
            web/coverage/lcov.info

  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            proto/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and embed the current production frontend
        run: |
          cd web && npm ci && npm run build
          cd ..
          mkdir -p hub/web/dist && cp -a web/dist/. hub/web/dist/
      - name: Run every test assigned to this server shard
        env:
          SERVER_SHARD_INDEX: ${{ matrix.shard }}
        run: python3 scripts/release/server_test_shards.py run --index "$SERVER_SHARD_INDEX" --shards 6 --timeout 1800 --output coverage-server
      - name: Upload exact server execution and coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-server-shard-${{ matrix.shard }}
          path: coverage-server/shard-${{ matrix.shard }}/
          if-no-files-found: error

  # Keep the required test status dependent on every matrix runner. An omitted,
  # failed or skipped prerequisite must fail this job, rather than skip the gate.
  test:
    needs: [unit, server-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all complete test jobs
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SERVER_RESULT: ${{ needs.server-tests.result }}
        run: test "$UNIT_RESULT" = success && test "$SERVER_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            proto/go.sum
      - name: Create the compile-only frontend embed required for inventory
        run: mkdir -p hub/web/dist && touch hub/web/dist/index.html
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-units
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-server-shard-*
          path: coverage-server
      - name: Validate the complete server inventory and merge atomic coverage
        run: python3 scripts/release/server_test_shards.py merge --input coverage-server --output coverage-hub.out --include coverage-hub.out --shards 6
      - name: Upload complete coverage for Sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            coverage-hub.out
            coverage-hub-cmd.out
            coverage-agent.out
            coverage-cli.out
            coverage-proto.out
            web/coverage/lcov.info

  integration:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            agent/go.sum
            cli/go.sum
            proto/go.sum
      - name: Create frontend embed stub
        run: mkdir -p hub/web/dist && touch hub/web/dist/index.html
      - name: Integration tests with coverage
        run: cd hub && go test -race ./internal/integration/ -v -timeout 10m -coverprofile=../coverage-integration.out -covermode=atomic -coverpkg=./internal/...

      - name: Require and report complete integration coverage
        if: always()
        run: |
          set -euo pipefail
          for profile in coverage-integration.out coverage-agent-integration.out; do
            test -f "$profile"
            test ! -L "$profile"
            test -s "$profile"
          done
          echo "=== Hub Integration Coverage ==="
          (cd hub && go tool cover -func=../coverage-integration.out | tail -1)
          echo "=== Agent Binary Integration Coverage ==="
          (cd agent && go tool cover -func=../coverage-agent-integration.out | tail -1)

      - name: Upload integration coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-integration
          path: |
            coverage-integration.out
            coverage-agent-integration.out
          if-no-files-found: error

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      # Authenticated pulls avoid Docker Hub throttling; skipped gracefully
      # when secrets are unavailable (Dependabot/fork runs).
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run smoke tests
        run: bash tests/smoke/smoke_test.sh
        env:
          BUILD_ARGS: "--build-arg NODE_IMAGE=node:25-slim --build-arg GO_IMAGE=golang:1.26.11-bookworm"

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Install Playwright
        run: cd tests/e2e && npm ci && npx playwright install --with-deps chromium

      # Authenticated pulls avoid Docker Hub throttling; skipped gracefully
      # when secrets are unavailable (Dependabot/fork runs).
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --build-arg NODE_IMAGE=node:25-slim --build-arg GO_IMAGE=golang:1.26.11-bookworm -t veyport-e2e:test .

      - name: Run E2E tests
        run: cd tests/e2e && E2E_IMAGE=veyport-e2e:test npx playwright test

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: tests/e2e/test-results/

  sonarcloud:
    needs: [test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ssdf-sonar-scan
    steps:
      - name: Hold legacy stable-tag Sonar scans
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              echo "Stable-tag Sonar analysis is held until the protected bridge replaces this legacy scanner" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
        working-directory: candidate-source
      # Exact already-reviewed main tooling avoids candidate execution before
      # this supervised bootstrap scan. It is separate from the future bridge.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: da509180b0de5725a5059e9aa031f22d39aa5856
          path: trusted-bootstrap
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage
          path: ${{ runner.temp }}/bootstrap-coverage-unit
          skip-decompress: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-integration
          path: ${{ runner.temp }}/bootstrap-coverage-integration
          skip-decompress: true
      - name: Prepare source data with independently pinned main tooling
        id: sonar-context
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SONAR_PULL_REQUEST_REQUIRED: ${{ inputs.sonar_pull_request_required }}
        run: |
          set -euo pipefail
          python3 -I -S - <<'BOOTSTRAP_PY'
          import hashlib, io, json, os, re, runpy, shutil, stat, subprocess, sys, zipfile
          from pathlib import Path
          PIN = 'da509180b0de5725a5059e9aa031f22d39aa5856'
          HASHES = {'scripts/release/sonar_context.py': 'b12ca76d392313aa5c1755741dd94e2d118033fdfa5af98e685679bc75508bba', 'scripts/release/metadata.py': '16678327293492e3305b3c3ef8fc9cbeaf4c435448a5901f5c226ee7f53f95ac', 'sonar-project.properties': '331c1f8687167567590f0de0c7c3d3fcb920aa4a25e4612ff33407b8782ff121'}
          COVERAGE = {
              'unit': {'coverage-hub.out', 'coverage-hub-cmd.out', 'coverage-agent.out', 'coverage-cli.out', 'coverage-proto.out', 'web/coverage/lcov.info'},
              'integration': {'coverage-integration.out', 'coverage-agent-integration.out'}}
          def require(ok):
              if not ok:
                  raise ValueError('Protected legacy Sonar preparation refused')
          def regular(path, maximum):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and 0 < info.st_size <= maximum)
                  value = stream.read(maximum + 1)
              require(len(value) == info.st_size)
              return value
          def write(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  os.fchmod(stream.fileno(), 0o600)
                  stream.write(value)
          def unique(items):
              value = {}
              for key, item in items:
                  require(key not in value)
                  value[key] = item
              return value
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          source, control = workspace / 'candidate-source', workspace / 'trusted-bootstrap'
          require(source.is_dir() and not source.is_symlink() and control.is_dir() and not control.is_symlink())
          require(subprocess.check_output(['git', '-C', str(control), 'rev-parse', 'HEAD'], text=True).strip() == PIN)
          trusted = {}
          for name, digest in HASHES.items():
              target = control
              for part in name.split('/'):
                  target = target / part
                  require(not target.is_symlink())
              trusted[name] = regular(target, 1 << 20)
              require(hashlib.sha256(trusted[name]).hexdigest() == digest)
          revision = os.environ['EXPECTED_SOURCE_SHA']
          require(re.fullmatch(r'[0-9a-f]{40}', revision) and os.environ['GITHUB_REPOSITORY'] == 'lorconksu/veyport')
          require(subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip() == revision)
          for base, dirs, files in os.walk(source, followlinks=False):
              if Path(base) == source:
                  dirs[:] = [name for name in dirs if name != '.git']
                  files = [name for name in files if name != '.git']
              require(all(not (Path(base) / name).is_symlink() for name in dirs + files))
              require(all(stat.S_ISREG((Path(base) / name).lstat().st_mode) for name in files))
          require(not (source / '.gitmodules').exists())
          received, total = {}, 0
          for group, expected in COVERAGE.items():
              root = Path(os.environ['RUNNER_TEMP']) / ('bootstrap-coverage-' + group)
              require(root.is_dir() and not root.is_symlink())
              rows = list(root.iterdir())
              require(len(rows) == 1)
              raw = regular(rows[0], 128 << 20)
              parents = {name.rsplit('/', level)[0] + '/' for name in expected for level in range(1, name.count('/') + 1)}
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  entries = archive.infolist()
                  require(1 <= len(entries) <= len(expected) + len(parents))
                  found, seen = set(), set()
                  for entry in entries:
                      kind = (entry.external_attr >> 16) & 0o170000
                      require(entry.filename not in seen and not entry.flag_bits & 1)
                      seen.add(entry.filename)
                      if entry.is_dir():
                          require(entry.filename in parents and kind in (0, stat.S_IFDIR) and entry.file_size == 0)
                          continue
                      require(entry.filename in expected and kind in (0, stat.S_IFREG) and 0 < entry.file_size <= 64 << 20)
                      require(entry.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED))
                      total += entry.file_size
                      require(total <= 512 << 20)
                      value = archive.read(entry)
                      require(len(value) == entry.file_size and b'\x00' not in value)
                      value.decode('utf-8')
                      found.add(entry.filename)
                      received[entry.filename] = value
                  require(found == expected)
          for name, value in received.items():
              write(source / name, value)
          # The legacy required scan uses only the old reviewed main profile, not the
          # forthcoming full-source coverage/exclusion inventory. Candidate config is data.
          write(source / 'sonar-project.properties', trusted['sonar-project.properties'])
          if (source / '.scannerwork').exists():
              require((source / '.scannerwork').is_dir())
              shutil.rmtree(source / '.scannerwork')
          private = Path(os.environ['RUNNER_TEMP']) / 'bootstrap-sonar'
          private.mkdir(mode=0o700)
          event = json.loads(regular(Path(os.environ['GITHUB_EVENT_PATH']), 1 << 20), object_pairs_hook=unique)
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              require(event['pull_request']['head']['repo']['full_name'] == 'lorconksu/veyport')
          required = os.environ.get('SONAR_PULL_REQUEST_REQUIRED', '')
          require(required in ('', 'false', 'true'))
          os.chdir(source)
          # -I -S excludes candidate cwd/PYTHONPATH; only the admitted old main helper and
          # metadata are repository imports. No candidate command/helper is executed.
          sys.path.insert(0, str(control / 'scripts/release'))
          helper = runpy.run_path(str(control / 'scripts/release/sonar_context.py'))
          args = helper['resolve'](os.environ['GITHUB_EVENT_NAME'], event, os.environ['GITHUB_REPOSITORY'],
                                   os.environ['GITHUB_REF'], revision, required == 'true')
          require(args == '-Dsonar.branch.name=main' or re.fullmatch(
              r'-Dsonar.pullrequest.key=[1-9][0-9]* -Dsonar.pullrequest.branch=[A-Za-z0-9_./+@-]{1,240} -Dsonar.pullrequest.base=main', args))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('gate_args=' + args + '\n')
          BOOTSTRAP_PY

      - uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          projectBaseDir: candidate-source
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
            -Dsonar.scanner.metadataFilePath=${{ runner.temp }}/bootstrap-sonar/report-task.txt
            -Dsonar.qualitygate.timeout=300
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            ${{ steps.sonar-context.outputs.gate_args }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install verified Gitleaks
        run: |
          bash scripts/release/install_tools.sh gitleaks "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Gitleaks secret scan
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: gitleaks git . --redact --report-format sarif --report-path gitleaks-results.sarif --exit-code 1

      - name: Upload Gitleaks artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif

  vulnerability-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: |
            hub/go.sum
            agent/go.sum
            cli/go.sum
            proto/go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Create frontend embed stub
        run: mkdir -p hub/web/dist && touch hub/web/dist/index.html

      - name: govulncheck production and application fixture source modules
        run: |
          set -euo pipefail
          mkdir -p source-vulnerability-results
          for module in hub agent cli proto infra/application-access/fixture; do
            report="${module//\//-}"
            (cd "$module" && govulncheck -show verbose ./...) 2>&1 | tee "source-vulnerability-results/$report.txt"
          done

      - name: Upload source vulnerability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-vulnerability-results
          path: source-vulnerability-results/

      - name: npm audit (Frontend)
        run: |
          set -euo pipefail
          echo "### npm audit - Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cd web && npm ci --ignore-scripts && npm audit --audit-level=high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  auto-release:
    needs: [integration, smoke, e2e, sonarcloud, secret-scan, vulnerability-scan]
    # Temporary publication hold for the trusted approval bootstrap: no tags or
    # release dispatch until reviewed qualification is complete. Restore only by
    # reviewed PR following docs/security/approval-bootstrap.md.
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: auto-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create next patch release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          if existing_tag="$(git describe --exact-match --tags --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null)"; then
            echo "HEAD is already tagged as ${existing_tag}; skipping auto-release."
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "${latest_tag}" ]; then
            echo "No existing vMAJOR.MINOR.PATCH release tag found." >&2
            exit 1
          fi

          if [[ ! "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest release tag ${latest_tag} is not a vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          next_tag="v${major}.${minor}.$((patch + 1))"

          if git ls-remote --exit-code --tags origin "refs/tags/${next_tag}" >/dev/null 2>&1; then
            echo "Release tag ${next_tag} already exists on origin." >&2
            exit 1
          fi

          git tag -a "${next_tag}" -m "${next_tag}"
          git push origin "refs/tags/${next_tag}"
          gh workflow run release.yml --ref "${next_tag}"

          {
            echo "### Auto Release"
            echo "Created release tag **${next_tag}** from \`${GITHUB_SHA}\`."
            echo "Dispatched the Release workflow for **${next_tag}** to publish Docker artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
