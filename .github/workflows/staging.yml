name: Staging Build

# Prototype dispatch builds and scans before publishing immutable prerelease
# artifacts. Ordinary :staging behavior remains explicitly selectable.
on:
  workflow_dispatch:
    inputs:
      prototype:
        description: Publish an immutable prototype after all required gates
        type: boolean
        default: true
      prototype_version:
        description: Prototype binary and OCI version
        type: string
        default: 2.0.50-prototype.6
      prototype_tag:
        description: Non-v immutable prototype tag
        type: string
        default: prototype-ssh-passthrough.6

permissions:
  contents: write
  actions: write

jobs:
  required-ci:
    if: inputs.prototype
    uses: ./.github/workflows/ci.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  prototype-delivery:
    if: inputs.prototype
    needs: required-ci
    uses: ./.github/workflows/delivery.yml
    with:
      version: ${{ inputs.prototype_version }}
      tag: ${{ inputs.prototype_tag }}
      prototype: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-and-push-staging:
    if: ${{ !inputs.prototype }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Derive version
        id: meta
        run: echo "version=$(git describe --tags --always --dirty)-staging" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: yiucloud/veyport:staging
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
