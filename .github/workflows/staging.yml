name: Staging Build

# Builds a deployable image from ANY branch and pushes it as the :staging tag,
# so features can be tested on the staging host BEFORE merge and release.
# Never touches :latest or version tags.
on:
  workflow_dispatch:

jobs:
  build-and-push-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive version
        id: meta
        run: echo "version=$(git describe --tags --always --dirty)-staging" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: yiucloud/veyport:staging
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
