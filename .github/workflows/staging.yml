name: Staging Build

# Prototype dispatch rehearses the complete private qualification path.
# Publication requires an explicit input and every release gate.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish qualified immutable prototype assets (leave false for private rehearsal)
        type: boolean
        default: false
      prototype:
        description: Use isolated prototype qualification (legacy mutable staging builds are disabled)
        type: boolean
        default: true
      prototype_version:
        description: Prototype binary and OCI version
        type: string
        default: 2.0.58-prototype.1
      prototype_tag:
        description: Non-v immutable prototype tag
        type: string
        default: prototype-ssdf.1

permissions:
  contents: write
  actions: write
  checks: read
  statuses: read
  security-events: read

jobs:
  required-ci:
    if: inputs.prototype
    uses: ./.github/workflows/ci.yml
    with:
      defer_semgrep_to_delivery: true
      sonar_pull_request_required: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  prototype-delivery:
    if: inputs.prototype
    needs: required-ci
    uses: ./.github/workflows/delivery.yml
    with:
      version: ${{ inputs.prototype_version }}
      tag: ${{ inputs.prototype_tag }}
      prototype: true
      source_workflow: .github/workflows/staging.yml
      publish: ${{ inputs.publish }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push-staging:
    if: ${{ !inputs.prototype }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject legacy unqualified public staging builds
        run: |
          echo "Mutable staging builds are disabled. Qualify an immutable candidate, then deploy its exact published digest to normal staging." >&2
          exit 1
