name: Approve exact security exception

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: Stable exception or coverage-review ID (RA-0001 or CR-0001)
        required: true
        type: string
      record_revision:
        description: Exact 40-character commit containing the proposed record
        required: true
        type: string
      record_sha256:
        description: SHA256 of the entire proposed Markdown file
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: security-approval-${{ inputs.record_id }}
  cancel-in-progress: false

jobs:
  approve:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor == 'lorconksu' && github.triggering_actor == 'lorconksu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewer must be the owner; sole-maintainer self-review is allowed.
    # Configure this environment before use. An unprotected auto-created
    # environment is rejected again by the verifier, including at release time.
    environment: ssdf-risk-approval
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch only the exact proposed record and bind owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_ID: ${{ inputs.record_id }}
          RECORD_REVISION: ${{ inputs.record_revision }}
          RECORD_SHA256: ${{ inputs.record_sha256 }}
        run: |
          python3 - <<'PY'
          import os,re,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/release')
          from risk_acceptance import GitHub,canonical,prepare
          identity=os.environ['RECORD_ID']
          revision=os.environ['RECORD_REVISION']
          digest=os.environ['RECORD_SHA256']
          if not re.fullmatch(r'(?:RA|CR)-\d{4,8}',identity) or not re.fullmatch(r'[0-9a-f]{40}',revision) or not re.fullmatch(r'[0-9a-f]{64}',digest):
              raise SystemExit('invalid bounded approval request')
          api=GitHub()
          root=Path(os.environ['RUNNER_TEMP'])/'approval'
          root.mkdir()
          record=root/(identity+'.md')
          destination='coverage-reviews' if identity.startswith('CR-') else 'risk-acceptances'
          record.write_bytes(api.content('docs/security/'+destination+'/'+identity+'.md',revision))
          approval=prepare(api,record,revision,digest,int(os.environ['GITHUB_RUN_ID']))
          (root/'approval.json').write_bytes(canonical(approval)+b'\n')
          PY
      - name: Retain disclosure-safe authenticated approval descriptor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssdf-approval-${{ inputs.record_id }}
          path: ${{ runner.temp }}/approval/approval.json
          if-no-files-found: error
          retention-days: 90
