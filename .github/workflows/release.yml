name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read
  statuses: read
  security-events: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require exact stable release tag
        id: identity
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release/metadata.py --version "$version" --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --ref "$GITHUB_REF"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  required-ci:
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      defer_semgrep_to_delivery: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  delivery:
    needs: [identity, required-ci]
    uses: ./.github/workflows/delivery.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      tag: ${{ github.ref_name }}
      prototype: false
      source_workflow: .github/workflows/release.yml
      publish: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
